services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: artificialcode
      MYSQL_USER: artificialcode
      MYSQL_PASSWORD: artificialcode
      MYSQL_ROOT_PASSWORD: artificialcode-root
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-partificialcode-root']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
